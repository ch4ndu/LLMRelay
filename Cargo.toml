[package]
name = "agenticjira"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"
description = "LLMRelay local task and agent workflow host"
build = "build.rs"
default-run = "llmrelay"

[[bin]]
name = "llmrelay"
path = "src/main.rs"

[[bin]]
name = "agenticjira"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.98"
axum = { version = "=0.8.4", features = ["http1", "json", "tokio"] }
base64 = "=0.22.1"
chrono = { version = "=0.4.41", default-features = false, features = ["clock", "serde"] }
clap = { version = "=4.5.40", features = ["derive"] }
fs2 = "=0.4.3"
hex = "=0.4.3"
libc = "=0.2.172"
portable-pty = "=0.9.0"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
subtle = "=2.6.1"
thiserror = "=2.0.12"
tokio = { version = "=1.45.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = { version = "=0.8.23", default-features = false, features = ["parse", "display"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter", "fmt"] }
uuid = { version = "=1.16.0", features = ["serde", "v4"] }

[profile.release]
strip = true
lto = "thin"
